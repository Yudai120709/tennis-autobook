name: テニスコート監視・自動予約

on:
  schedule:
    # 毎時7分（日本時間）に空きを確認。※GitHubの時刻はUTC（日本時間－9時間）
    # 日本時間 2:07・3:07・4:07 は起動しない（UTC 17〜19時を除く）
    # 日本時間 22:07・23:07・0:07（UTC 13〜15時）は、21日の夜（UTC 21日）だけ起動しない
    #   → 一斉予約の前後に毎時確認が割り込んで、一斉予約が順番待ちで取り消されるのを防ぐ
    - cron: "7 0-12,16,20-23 * * *"
    - cron: "7 13-15 1-20,22-31 * *"
    # ただし日本時間22日の 2:07・3:07・4:07 は起動する（UTC では21日の17〜19時）
    - cron: "7 17-19 21 * *"
    # 毎月21日 22:23 と 22:53（日本時間）に、22日0:00 の一斉予約ジョブを起動
    #   GitHubの定期実行は30分前後遅れることがあるため早めに起動し、中で0時まで待つ
    #   2本目は1本目が起動しなかったときの予備（1本目が終わっていれば何もしない）
    - cron: "23 13 21 * *"
    - cron: "53 13 21 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options: [check, release_now]
        default: check

permissions:
  contents: write

concurrency:
  group: tennis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: 実行する処理を決める
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 13 21 * *" ] || [ "${{ github.event.schedule }}" = "53 13 21 * *" ]; then
            echo "task=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=check" >> "$GITHUB_OUTPUT"
          fi

      - name: 空き状況を確認
        id: check
        if: steps.task.outputs.task == 'check'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_courts.py

      - name: ブラウザを準備（予約するときだけ）
        if: steps.check.outputs.book == 'true' || steps.task.outputs.task != 'check'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 空いた枠を予約
        if: steps.check.outputs.book == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SPOREC_USER_ID: ${{ secrets.SPOREC_USER_ID }}
          SPOREC_PASSWORD: ${{ secrets.SPOREC_PASSWORD }}
        run: python book.py

      - name: 22日0:00 の一斉予約
        if: steps.task.outputs.task == 'release' || steps.task.outputs.task == 'release_now'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SPOREC_USER_ID: ${{ secrets.SPOREC_USER_ID }}
          SPOREC_PASSWORD: ${{ secrets.SPOREC_PASSWORD }}
        run: |
          if [ "${{ steps.task.outputs.task }}" = "release_now" ]; then
            python book.py --release --now
          else
            python book.py --release
          fi

      - name: 画面のスクリーンショットを保存（7日間）
        if: always() && hashFiles('shots/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 7

      - name: 状態（通知済み・予約済みの枠）を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
