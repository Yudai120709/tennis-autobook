name: テニスコート空き監視・通知

on:
  schedule:
    # 【ふだん】毎日24時間ずっと5分おきに空き確認（完全ノンストップ）
    - cron: "*/5 * * * *"
    # 【22日一斉解放】絶対に出遅れないための多段先行起動
    # 日本時間 21日 23:30 / 23:40 / 23:50（UTC 14:30 / 14:40 / 14:50）
    - cron: "30 14 21 * *"
    - cron: "40 14 21 * *"
    - cron: "50 14 21 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options: [check, release_now]
        default: check

permissions:
  contents: write

concurrency:
  group: tennis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install requests

      - name: 実行する処理を決める（21日夜の待機制御含む）
        id: task
        run: |
          # 日本時間（JST）の「日」と「時」を取得
          d=$(TZ=Asia/Tokyo date +%-d)
          h=$(TZ=Asia/Tokyo date +%-H)
          m=$(TZ=Asia/Tokyo date +%-M)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 14 21 * *" ] || [ "${{ github.event.schedule }}" = "40 14 21 * *" ] || [ "${{ github.event.schedule }}" = "50 14 21 * *" ]; then
            echo "task=release" >> "$GITHUB_OUTPUT"
          else
            # 21日の日本時間 22:00〜23:59 は翌0時の解放準備のため通常巡回を休止
            if [ "$d" -eq 21 ] && [ "$h" -ge 22 ]; then
              echo "日本時間 21日 ${h}:${m} は22日一斉解放直前の待機時間のため、通常巡回をスキップします"
              echo "task=skip" >> "$GITHUB_OUTPUT"
            else
              echo "task=check" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 空き確認を実行（通常）
        if: steps.task.outputs.task == 'check'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_courts.py

      - name: 22日一斉解放スキャン（00:00:01 ジャストに実行）
        if: steps.task.outputs.task == 'release' || steps.task.outputs.task == 'release_now'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_courts.py --release

      - name: 通知履歴（state.json）を保存
        if: always() && steps.task.outputs.task != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "update state [skip ci]" || true
            # 競合防止のため pull --rebase してから push（最大3回リトライ）
            for i in {1..3}; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "state.jsonの保存に成功しました"
                break
              fi
              sleep 3
            done || true
          fi
