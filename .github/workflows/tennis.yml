name: テニスコート空き監視・通知

on:
  schedule:
    # ※GitHubの時刻はUTC（日本時間－9時間）。
    # 【ふだん】日本時間 6:00〜24:59 の間、5分おきに空き確認（深夜1:00〜5:59は停止）
    # JST 6:00〜8:59 (UTC 21:00〜23:59), JST 9:00〜24:59 (UTC 0:00〜15:59)
    - cron: "*/5 21-23 * * *"
    - cron: "*/5 0-15 * * *"
    # 【22日一斉解放】絶対に出遅れないための多段先行起動
    # GitHub Actions の cron は混雑時に5〜15分遅れることがあるため、
    # 21日 23:30 / 23:40 / 23:50（日本時間）の3本を予約起動する。
    # 中のスクリプトで「22日 00:00:01」まで秒単位でカウントダウン待機する。
    # （先行するジョブが待機・実行中の場合、後続のジョブは安全にスキップされる）
    - cron: "30 14 21 * *"
    - cron: "40 14 21 * *"
    - cron: "50 14 21 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options: [check, release_now]
        default: check

permissions:
  contents: write

# 22日解放待機中に重複して走らないよう制御
concurrency:
  group: tennis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install requests

      - name: 実行する処理を決める
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 14 21 * *" ] || [ "${{ github.event.schedule }}" = "40 14 21 * *" ] || [ "${{ github.event.schedule }}" = "50 14 21 * *" ]; then
            echo "task=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=check" >> "$GITHUB_OUTPUT"
          fi

      - name: 空き確認を実行（通常）
        if: steps.task.outputs.task == 'check'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_courts.py

      - name: 22日一斉解放スキャン（00:00:01 ジャストに実行）
        if: steps.task.outputs.task == 'release' || steps.task.outputs.task == 'release_now'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_courts.py --release

      - name: 通知履歴（state.json）を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "update state [skip ci]"
            git push
          fi
